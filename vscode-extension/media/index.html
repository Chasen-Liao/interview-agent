<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource} 'nonce-${nonce}'; script-src 'nonce-${nonce}';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Agent</title>
  <link rel="stylesheet" nonce="${nonce}" href="${stylesUri}" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar__title">Interview Agent</div>
      <button id="settings" class="icon-button" title="打开设置" aria-label="打开设置">⚙</button>
    </header>

    <section class="config">
      <label class="field">
        <span class="field__label">Provider</span>
        <select id="provider" class="field__control">
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
          <option value="qwen">通义千问</option>
          <option value="zhipu">智谱</option>
          <option value="custom">自定义</option>
        </select>
      </label>

      <label class="field">
        <span class="field__label">Model</span>
        <input id="model" class="field__control" type="text" spellcheck="false" />
      </label>

      <label class="field">
        <span class="field__label">Base URL</span>
        <input id="baseUrl" class="field__control" type="text" spellcheck="false" />
      </label>

      <label class="field">
        <span class="field__label">API Key</span>
        <input id="apiKey" class="field__control" type="password" spellcheck="false" autocomplete="off" />
      </label>

      <div class="config__row">
        <label class="toggle">
          <input id="demoMode" type="checkbox" />
          <span>Demo Mode</span>
        </label>
        <button id="saveConfig" class="secondary-button">保存</button>
      </div>
      <div id="configStatus" class="status"></div>
    </section>

    <section id="setup" class="setup">
      <label class="field">
        <span class="field__label">岗位 JD</span>
        <textarea id="jd" class="field__textarea" rows="5"></textarea>
      </label>

      <div class="field">
        <span class="field__label">简历</span>
        <button id="pickResume" class="resume-upload" type="button">
          <span class="resume-upload__icon">＋</span>
          <span class="resume-upload__body">
            <span class="resume-upload__title">上传简历附件</span>
            <span id="resumeFile" class="resume-upload__meta">支持 .pdf / .docx / .txt / .md</span>
          </span>
        </button>
        <textarea id="resumeSupplement" class="field__textarea" rows="4"></textarea>
      </div>

      <div class="workspace-info">
        <div class="field__label">当前项目</div>
        <div id="workspaceInfo" class="workspace-info__value">自动读取当前 VS Code 工作区</div>
      </div>

      <button id="startInterview" class="primary-button">开始面试</button>
    </section>

    <div id="messages" class="messages"></div>

    <div class="composer">
      <textarea id="input" class="composer__input" rows="3"></textarea>
      <button id="action" class="composer__action" title="发送" aria-label="发送">↑</button>
    </div>
  </div>

  <script nonce="${nonce}" src="${scriptUri}"></script>
</body>
</html>
